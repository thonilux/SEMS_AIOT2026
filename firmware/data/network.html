<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Network</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body data-page="network">
  <header class="bar">
    <div class="top">
      <div class="brand">
        <h1>Network</h1>
        <div class="muted">PM1611 RS485 Reader</div>
      </div>
      <button id="menuBtn" class="menuBtn" type="button">Menu</button>
    </div>
    <nav id="mainNav" class="nav">
      <a href="/">Home</a>
      <a href="/network">Network</a>
      <a href="/device">Device</a>
      <a href="/mqtt">MQTT</a>
      <a href="/modbus">Modbus</a>
      <a href="/protection">Protection</a>
      <a href="/display">Display</a>
      <a href="/history">History</a>
      <a href="/system">System</a>
      <a href="#" onclick="rebootDevice();return false;">Reboot</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>WiFi Nearby</h2>
      <div class="actions">
        <button id="scanBtn" type="button" onclick="scanWifi()">Scan WiFi</button>
      </div>
      <p id="scanState" class="muted">Ready.</p>
      <div id="networks"></div>
    </section>

    <section class="panel">
      <h2>WiFi Connection</h2>
      <label for="ssid">SSID</label>
      <input id="ssid" maxlength="32" placeholder="WiFi SSID">
      <label for="password">Password</label>
      <input id="password" type="password" maxlength="64" placeholder="WiFi password">
      <div class="actions">
        <button type="button" onclick="saveWifi()">Save WiFi</button>
        <button type="button" onclick="rebootDevice()">Reboot</button>
      </div>
      <p id="saveState" class="muted">Saved credentials apply after reboot.</p>
    </section>
  </main>
</body>
</html>
