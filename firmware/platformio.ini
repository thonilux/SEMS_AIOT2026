[platformio]
default_envs = esp32dev
core_dir = pio-core
src_dir = src
include_dir = include
lib_dir = lib
data_dir = data
test_dir = test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
upload_port = COM3
monitor_port = COM3

build_flags =
  -D FW_NAME=\"PM1611_RS485_READER\"
  -D FW_VERSION=\"0.1.0-dev\"
