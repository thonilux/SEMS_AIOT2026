[platformio]
default_envs = esp32dev
core_dir = pio-core

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM6
monitor_port = COM6
lib_deps =
  olikraus/U8g2 @ ^2.36.18
  knolleary/PubSubClient @ ^2.8

board_build.sdkconfig = sdkconfig.board
board_build.partitions = no_fs.csv

build_flags =
  -D FW_VERSION=\"0.1.0\"
  -D CONFIG_ETH_SPI_ETHERNET_W5500=1
  -D ARDUINO_LOOP_STACK_SIZE=8192
