[platformio]
default_envs = network_test
core_dir = pio-core
src_dir = src
include_dir = include
lib_dir = lib
data_dir = data
test_dir = test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
build_src_filter = -<main_net.cpp> +<main.cpp> +<ConfigManager.cpp>

build_flags =
  -D FW_NAME=\"SEMS_AIOT\"
  -D FW_VERSION=\"0.1.0-dev\"

lib_deps =
  knolleary/PubSubClient @ ^2.8
  olikraus/U8g2 @ ^2.35.30
  arduino-libraries/Ethernet @ ^2.0.2

[env:network_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
build_src_filter = -<main.cpp> +<main_net.cpp> +<ConfigManager.cpp>
build_flags =
  -D FW_NAME=\"SEMS_AIOT_NET\"
  -D FW_VERSION=\"0.1.0-net\"
lib_deps =
  knolleary/PubSubClient @ ^2.8
  arduino-libraries/Ethernet @ ^2.0.2
