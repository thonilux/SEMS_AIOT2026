[platformio]
default_envs = network_test
core_dir = pio-core
src_dir = src
include_dir = include
lib_dir = lib
data_dir = data
test_dir = test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
build_src_filter = -<main_net.cpp> +<main.cpp> +<ConfigManager.cpp>
; Physical board has 16MB flash (board "esp32dev" defaults to 4MB/default.csv)
; — override to use the full chip with large dual-OTA app slots.
board_upload.flash_size = 16MB
board_build.flash_size  = 16MB
board_build.partitions  = partitions_16mb.csv

build_flags =
  -D FW_NAME=\"SEMS_AIOT\"
  -D FW_VERSION=\"0.1.0-dev\"
  ; Silence ESP32 core framework log_e/log_w/log_i noise (e.g. WebServer's
  ; benign "request handler not found" for stray browser requests like
  ; /favicon.ico). Our own diagnostics all go through Serial.print directly,
  ; so this doesn't affect anything we rely on.
  -D CORE_DEBUG_LEVEL=0

lib_deps =
  knolleary/PubSubClient @ ^2.8
  olikraus/U8g2 @ ^2.35.30
  arduino-libraries/Ethernet @ ^2.0.2

[env:network_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
build_src_filter = -<main.cpp> +<main_net.cpp> +<ConfigManager.cpp>
build_flags =
  -D FW_NAME=\"SEMS_AIOT_NET\"
  -D FW_VERSION=\"0.1.0-net\"
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  knolleary/PubSubClient @ ^2.8
  arduino-libraries/Ethernet @ ^2.0.2
