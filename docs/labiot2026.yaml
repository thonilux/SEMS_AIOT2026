esphome:
  name: smart_enms_ac
  friendly_name: Smart ENMS AC

substitutions:
  telemetry_endpoint: "http://your-server/api/pm2230/data"
  energy_endpoint: "http://your-server/api/pm2230/energy"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 9600
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  deassert_rts_dtr: true
  logs:
    display.component: ERROR

api:

ota:
  - platform: esphome

wifi:
  ssid: "IoT"
  password: "agusramelan"
  power_save_mode: none
  output_power: 8.5dB
  fast_connect: true
  reboot_timeout: 0s

captive_portal:

web_server:
  port: 80

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

uart:
  id: mod_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200
  stop_bits: 1
  parity: EVEN

modbus:
  id: modbus1
  uart_id: mod_bus

modbus_controller:
  - id: kwh1
    address: 1
    modbus_id: modbus1
    update_interval: 5s
    command_throttle: 100ms
    setup_priority: -10

http_request:
  useragent: esphome/device
  timeout: 10s
  verify_ssl: false

globals:
  - id: kwh1_connected
    type: bool
    restore_value: no
    initial_value: "false"
  - id: dataup
    type: bool
    restore_value: no
    initial_value: "false"

font:
  - file: "Arial.ttf"
    id: font1
    size: 11

  - file: "BebasNeue-Regular.ttf"
    id: font2
    size: 24

  - file: "Icons South St.ttf"
    id: font3
    size: 9

  - file: "Icons South St.ttf"
    id: font4
    size: 18

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: wifi_rssi
    update_interval: 60s

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Voltage AC"
    id: modbus_voltage_ac1
    register_type: holding
    address: 3027
    unit_of_measurement: "V"
    value_type: FP32
    accuracy_decimals: 2
    on_value:
      then:
        - lambda: |-
            id(kwh1_connected) = true;

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Voltage PP"
    id: modbus_voltage_pp1
    register_type: holding
    address: 3029
    unit_of_measurement: "V"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Voltage LP"
    id: modbus_voltage_lp1
    register_type: holding
    address: 3031
    unit_of_measurement: "V"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Current AC"
    id: modbus_current_ac1
    register_type: holding
    address: 2999
    unit_of_measurement: "A"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Current PP"
    id: modbus_current_pp1
    register_type: holding
    address: 3001
    unit_of_measurement: "A"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Current LP"
    id: modbus_current_lp1
    register_type: holding
    address: 3003
    unit_of_measurement: "A"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Active Power AC"
    id: modbus_active_power_ac1
    register_type: holding
    address: 3053
    unit_of_measurement: "kW"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Active Power PP"
    id: modbus_active_power_pp1
    register_type: holding
    address: 3055
    unit_of_measurement: "kW"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Active Power LP"
    id: modbus_active_power_lp1
    register_type: holding
    address: 3057
    unit_of_measurement: "kW"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Reactive Power AC"
    id: modbus_reactive_power_ac1
    register_type: holding
    address: 3061
    unit_of_measurement: "kVAR"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Reactive Power PP"
    id: modbus_reactive_power_pp1
    register_type: holding
    address: 3063
    unit_of_measurement: "kVAR"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Reactive Power LP"
    id: modbus_reactive_power_lp1
    register_type: holding
    address: 3065
    unit_of_measurement: "kVAR"
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Energy AC"
    id: modbus_energy_ac1
    register_type: holding
    address: 2811
    unit_of_measurement: "kWh"
    value_type: FP32
    accuracy_decimals: 3

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Energy PP"
    id: modbus_energy_pp1
    register_type: holding
    address: 2813
    unit_of_measurement: "kWh"
    value_type: FP32
    accuracy_decimals: 3

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Energy LP"
    id: modbus_energy_lp1
    register_type: holding
    address: 2815
    unit_of_measurement: "kWh"
    value_type: FP32
    accuracy_decimals: 3

  - platform: modbus_controller
    modbus_controller_id: kwh1
    name: "Frequency"
    id: modbus_grid_frequency1
    register_type: holding
    address: 3109
    unit_of_measurement: "Hz"
    value_type: FP32
    accuracy_decimals: 2

interval:
  - interval: 30s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: ${telemetry_endpoint}
                request_headers:
                  Content-Type: application/json
                  Accept: application/json
                body: !lambda |-
                  char buffer[256];

                  float frekuensi = id(modbus_grid_frequency1).state;
                  float tegangan = id(modbus_voltage_ac1).state;
                  float arus_a = id(modbus_current_ac1).state;
                  float arus_b = id(modbus_current_pp1).state;
                  float arus_c = id(modbus_current_lp1).state;
                  float active_a_kw = id(modbus_active_power_ac1).state;
                  float active_b_kw = id(modbus_active_power_pp1).state;
                  float active_c_kw = id(modbus_active_power_lp1).state;
                  float reactive_a_kvar = id(modbus_reactive_power_ac1).state;
                  float reactive_b_kvar = id(modbus_reactive_power_pp1).state;
                  float reactive_c_kvar = id(modbus_reactive_power_lp1).state;

                  if (isnan(frekuensi)) frekuensi = 0.0f;
                  if (isnan(tegangan)) tegangan = 0.0f;
                  if (isnan(arus_a)) arus_a = 0.0f;
                  if (isnan(arus_b)) arus_b = 0.0f;
                  if (isnan(arus_c)) arus_c = 0.0f;
                  if (isnan(active_a_kw)) active_a_kw = 0.0f;
                  if (isnan(active_b_kw)) active_b_kw = 0.0f;
                  if (isnan(active_c_kw)) active_c_kw = 0.0f;
                  if (isnan(reactive_a_kvar)) reactive_a_kvar = 0.0f;
                  if (isnan(reactive_b_kvar)) reactive_b_kvar = 0.0f;
                  if (isnan(reactive_c_kvar)) reactive_c_kvar = 0.0f;

                  float arus = arus_a + arus_b + arus_c;
                  float active_power = (active_a_kw + active_b_kw + active_c_kw) * 1000.0f;
                  float reactive_power = (reactive_a_kvar + reactive_b_kvar + reactive_c_kvar) * 1000.0f;
                  float apparent_power = sqrtf((active_power * active_power) + (reactive_power * reactive_power));

                  snprintf(
                    buffer,
                    sizeof(buffer),
                    "{\"id_kwh\":1,\"frekuensi\":%.2f,\"arus\":%.2f,\"tegangan\":%.2f,\"active_power\":%.2f,\"reactive_power\":%.2f,\"apparent_power\":%.2f}",
                    frekuensi,
                    arus,
                    tegangan,
                    active_power,
                    reactive_power,
                    apparent_power
                  );

                  return std::string(buffer);

  - interval: 60s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: ${energy_endpoint}
                request_headers:
                  Content-Type: application/json
                  Accept: application/json
                body: !lambda |-
                  char buffer[96];

                  float kwh1 = id(modbus_energy_ac1).state;
                  if (isnan(kwh1)) kwh1 = 0.0f;

                  snprintf(
                    buffer,
                    sizeof(buffer),
                    "{\"id_kwh\":1,\"total_energy\":%.3f}",
                    kwh1
                  );

                  return std::string(buffer);

            - delay: 500ms

            - http_request.post:
                url: ${energy_endpoint}
                request_headers:
                  Content-Type: application/json
                  Accept: application/json
                body: !lambda |-
                  char buffer[96];

                  float kwh2 = id(modbus_energy_pp1).state;
                  if (isnan(kwh2)) kwh2 = 0.0f;

                  snprintf(
                    buffer,
                    sizeof(buffer),
                    "{\"id_kwh\":2,\"total_energy\":%.3f}",
                    kwh2
                  );

                  return std::string(buffer);

            - delay: 500ms

            - http_request.post:
                url: ${energy_endpoint}
                request_headers:
                  Content-Type: application/json
                  Accept: application/json
                body: !lambda |-
                  char buffer[96];

                  float kwh3 = id(modbus_energy_lp1).state;
                  if (isnan(kwh3)) kwh3 = 0.0f;

                  snprintf(
                    buffer,
                    sizeof(buffer),
                    "{\"id_kwh\":3,\"total_energy\":%.3f}",
                    kwh3
                  );

                  return std::string(buffer);
